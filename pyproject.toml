[project]
name = "credit-risk-coursework"
version = "0.1.0"
description = "Credit risk EDA and notebook build tooling"
requires-python = ">=3.13"
dependencies = [
  "pandas==3.1.0",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "scikit-learn==1.9.1",
  "matplotlib==3.11.2",
  "seaborn==0.13.2",
  "ipython==9.18.0"
]

[project.optional-dependencies]
dev = [
  "nbformat==5.11.1",
  "nbclient==0.11.0",
  "ipykernel==7.4.0",
  "jupyter-client==8.10.0"
]
